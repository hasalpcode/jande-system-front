<h2 mat-dialog-title>{{ enEdition ? 'Modifier le semestre' : 'Ajouter un semestre' }}</h2>

<form [formGroup]="form" (ngSubmit)="soumettre()">
  <mat-dialog-content class="contenu">
    <mat-form-field appearance="outline">
      <mat-label>Libellé</mat-label>
      <input matInput formControlName="libelle" placeholder="Semestre 1" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Année académique</mat-label>
      <mat-select formControlName="anneeAcademiqueId">
        @for (a of data.annees; track a.id) { <mat-option [value]="a.id">{{ a.libelle }}</mat-option> }
      </mat-select>
    </mat-form-field>

    @if (erreur()) {
      <p class="erreur">{{ erreur() }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="annuler()">Annuler</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="enCours()">
      @if (enCours()) {
        <mat-spinner diameter="20" />
      } @else {
        {{ enEdition ? 'Enregistrer' : 'Ajouter' }}
      }
    </button>
  </mat-dialog-actions>
</form>
