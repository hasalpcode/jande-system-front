<h2 mat-dialog-title>{{ enEdition ? 'Modifier la filière' : 'Ajouter une filière' }}</h2>

<form [formGroup]="form" (ngSubmit)="soumettre()">
  <mat-dialog-content class="contenu">
    <div class="ligne">
      <mat-form-field appearance="outline" class="small">
        <mat-label>Code</mat-label>
        <input matInput formControlName="code" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="grow">
        <mat-label>Libellé</mat-label>
        <input matInput formControlName="libelle" />
      </mat-form-field>
    </div>
    <mat-form-field appearance="outline">
      <mat-label>Option</mat-label>
      <mat-select formControlName="optionId">
        @for (o of data.options; track o.id) { <mat-option [value]="o.id">{{ o.libelle }}</mat-option> }
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Grade</mat-label>
      <input matInput formControlName="grade" placeholder="Licence, Master…" />
    </mat-form-field>

    @if (erreur()) {
      <p class="erreur">{{ erreur() }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="annuler()">Annuler</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="enCours()">
      @if (enCours()) {
        <mat-spinner diameter="20" />
      } @else {
        {{ enEdition ? 'Enregistrer' : 'Ajouter' }}
      }
    </button>
  </mat-dialog-actions>
</form>
