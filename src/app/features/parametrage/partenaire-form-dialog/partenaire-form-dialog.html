<h2 mat-dialog-title>{{ enEdition ? 'Modifier le partenaire' : 'Ajouter un partenaire' }}</h2>

<form [formGroup]="form" (ngSubmit)="soumettre()">
  <mat-dialog-content class="contenu">
    <mat-form-field appearance="outline">
      <mat-label>Nom</mat-label>
      <input matInput formControlName="nom" />
    </mat-form-field>
    <div class="ligne">
      <mat-form-field appearance="outline">
        <mat-label>Type</mat-label>
        <input matInput formControlName="type" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Contact</mat-label>
        <input matInput formControlName="contact" />
      </mat-form-field>
    </div>

    @if (erreur()) {
      <p class="erreur">{{ erreur() }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="annuler()">Annuler</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="enCours()">
      @if (enCours()) {
        <mat-spinner diameter="20" />
      } @else {
        {{ enEdition ? 'Enregistrer' : 'Ajouter' }}
      }
    </button>
  </mat-dialog-actions>
</form>
