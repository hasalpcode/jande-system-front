<h2 mat-dialog-title>{{ enEdition ? 'Modifier la nationalité' : 'Ajouter une nationalité' }}</h2>

<form [formGroup]="form" (ngSubmit)="soumettre()">
  <mat-dialog-content class="contenu">
    <div class="ligne">
      <mat-form-field appearance="outline" class="small">
        <mat-label>Code</mat-label>
        <input matInput formControlName="code" placeholder="SEN" maxlength="3" style="text-transform: uppercase;" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="grow">
        <mat-label>Libellé</mat-label>
        <input matInput formControlName="libelle" placeholder="Sénégalaise" />
      </mat-form-field>
    </div>

    @if (erreur()) {
      <p class="erreur">{{ erreur() }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="annuler()">Annuler</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="enCours()">
      @if (enCours()) {
        <mat-spinner diameter="20" />
      } @else {
        {{ enEdition ? 'Enregistrer' : 'Ajouter' }}
      }
    </button>
  </mat-dialog-actions>
</form>
