<h2 mat-dialog-title>Nouvelle inscription</h2>

<form [formGroup]="form" (ngSubmit)="continuer()">
  <mat-dialog-content style="min-width: 360px;">
    <p class="muted">Choisissez le niveau de l'étudiant à inscrire.</p>
    <mat-form-field appearance="outline" style="width: 100%;">
      <mat-label>Niveau</mat-label>
      <mat-select formControlName="niveauId">
        @for (n of data.niveaux; track n.id) { <mat-option [value]="n.id">{{ n.libelle }}</mat-option> }
      </mat-select>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="annuler()">Annuler</button>
    <button mat-flat-button color="primary" type="submit">Continuer</button>
  </mat-dialog-actions>
</form>
