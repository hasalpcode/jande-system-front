<h2 mat-dialog-title>Nouvel établissement</h2>

<form [formGroup]="form" (ngSubmit)="soumettre()">
  <mat-dialog-content class="contenu">
    <mat-form-field appearance="outline">
      <mat-label>Nom de l'établissement</mat-label>
      <input matInput formControlName="nom" autocomplete="off" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Type</mat-label>
      <mat-select formControlName="type">
        @for (t of types; track t) {
          <mat-option [value]="t">{{ t }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Adresse</mat-label>
      <input matInput formControlName="adresse" autocomplete="off" />
    </mat-form-field>

    <h3 class="section-titre">Compte admin initial</h3>

    <div class="ligne">
      <mat-form-field appearance="outline">
        <mat-label>Nom</mat-label>
        <input matInput formControlName="adminNom" autocomplete="off" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Prénom</mat-label>
        <input matInput formControlName="adminPrenom" autocomplete="off" />
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline">
      <mat-label>Email de l'admin</mat-label>
      <input matInput type="email" formControlName="adminEmail" autocomplete="off" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Mot de passe initial</mat-label>
      <input matInput type="password" formControlName="adminMotDePasse" autocomplete="new-password" />
      @if (form.controls.adminMotDePasse.hasError('minlength')) {
        <mat-error>8 caractères minimum</mat-error>
      }
    </mat-form-field>

    @if (erreur()) {
      <p class="erreur">{{ erreur() }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="annuler()">Annuler</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="enCours()">
      @if (enCours()) {
        <mat-spinner diameter="20" />
      } @else {
        Créer l'établissement
      }
    </button>
  </mat-dialog-actions>
</form>
